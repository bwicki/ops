name: FAA NMS Erreichbarkeit prüfen

# Einmaliger Test (0.13.1): erreicht ein GitHub-Actions-Runner die FAA-NMS-API? Cloudflare Workers werden von
# der Google-Cloud-Sperrliste (403) abgewiesen (FAA NAIMES, INC0033867, 19.10.2026). Ohne Zugangsdaten wird 401 erwartet.
# Ergebnis wird nach data/faa-probe.txt geschrieben (Protokolle sind aus der Entwicklungsumgebung nicht lesbar).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Endpunkte ohne Zugangsdaten (erwartet 401, nicht 403)
        run: |
          out=data/faa-probe.txt; mkdir -p data; : > "$out"
          echo "Probe $(date -u +%FT%TZ) von GitHub Actions ($(curl -s https://api.ipify.org || echo ip?))" >> "$out"
          for u in 'https://api-nms.aim.faa.gov/v1/auth/token' 'https://api-nms.aim.faa.gov/nmsapi/v1/notams?latitude=47.4&longitude=8.5&radius=20'; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' -X POST "$u" -H 'Authorization: Basic Zm9vOmJhcg==' -H 'Accept: application/json' || echo 000)
            echo "$u -> HTTP $code" >> "$out"; head -c 300 /tmp/body >> "$out"; echo >> "$out"
          done
          cat "$out"
      - name: Ergebnis ablegen
        run: |
          git config user.name 'faa-probe'; git config user.email 'faa-probe@users.noreply.github.com'
          git add data/faa-probe.txt; git commit -m "FAA-Probe $(date -u +%FT%TZ)" || exit 0; git push
