name: openAIP-Exporte prüfen

# Einmaliger Test (0.14.3): ist der schlüssellose Export-Host s3.openaip.net/openaip-system-exports erreichbar, und wie sehen
# die Dateien aus (Grösse, Eigenschaften des ersten Luftraums)? Ergebnis nach data/openaip-export-probe.txt.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Exporte abrufen
        run: |
          out=data/openaip-export-probe.txt; mkdir -p data; : > "$out"
          echo "Probe $(date -u +%FT%TZ)" >> "$out"
          for cc in li ch de at fr it; do
            u="https://s3.openaip.net/openaip-system-exports/${cc}_asp.geojson"
            code=$(curl -sS -o /tmp/$cc.geojson -w '%{http_code}' -D /tmp/$cc.h "$u" || echo 000)
            echo "$cc -> HTTP $code, $(stat -c %s /tmp/$cc.geojson 2>/dev/null || echo 0) Bytes, last-modified: $(grep -i '^last-modified' /tmp/$cc.h | tr -d '\r' | cut -d' ' -f2-)" >> "$out"
          done
          node -e "
            const fs=require('fs'); const j=JSON.parse(fs.readFileSync('/tmp/ch.geojson','utf8'));
            const f=j.features?.[0]; console.log('CH features', j.features?.length, 'top keys', Object.keys(j).join(','), 'keys', Object.keys(f?.properties||{}).join(','));
            const ctr=j.features.find(x=>/CTR/i.test(x.properties?.name||''))||f; console.log(JSON.stringify({...ctr, geometry: ctr.geometry?.type}).slice(0,1500));
          " >> "$out" 2>&1 || echo "CH nicht parsebar: $(head -c 200 /tmp/ch.geojson)" >> "$out"
          cat "$out"
      - name: Ergebnis ablegen
        run: |
          git config user.name 'openaip-probe'; git config user.email 'openaip-probe@users.noreply.github.com'
          git add data/openaip-export-probe.txt; git commit -m "openAIP-Export-Probe $(date -u +%FT%TZ)" || exit 0; git pull --rebase; git push
